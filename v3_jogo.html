<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Vida V3</title><style>
:root{--bg:#07111f;--card:#0d1b2e;--card2:#11243b;--txt:#f3f7fb;--muted:#9db0c5;--green:#38d996;--blue:#55a8ff;--gold:#ffd166;--red:#ff6678}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#06101c,#0b1830 55%,#07111f);color:var(--txt);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.app{max-width:480px;margin:auto;min-height:100vh;padding:18px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-weight:900;font-size:22px}.v{color:var(--green);font-size:12px}.money{font-weight:800;color:var(--gold)}.card{background:rgba(13,27,46,.96);border:1px solid #1b3553;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 10px 30px #0003}.hero{padding:22px;background:linear-gradient(145deg,#123254,#0b1d32)}h1,h2,h3,p{margin:0 0 9px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#0a1728;border-radius:13px;padding:11px}.stat b{display:block;font-size:17px}.bar{height:7px;background:#203249;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green);width:60%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;padding:12px;color:white;background:#17314d;cursor:pointer}.btn:hover{filter:brightness(1.15)}.primary{background:linear-gradient(135deg,#27c98c,#168d70);font-weight:800}.blue{background:#15538b}.gold{background:#765a14}.danger{background:#6c2734}.event{border:1px solid #37536d;background:linear-gradient(145deg,#122942,#0d1b2e)}.choice{display:block;width:100%;text-align:left;margin-top:9px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#17324d;color:#9ed0ff;font-size:11px;margin-right:5px}.tabs{position:sticky;bottom:0;background:#07111fee;padding:9px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;backdrop-filter:blur(12px)}.tab{background:#0e2136;border:1px solid #1d3a57;color:#bcd0e5;border-radius:10px;padding:9px 4px;font-size:11px}.hidden{display:none}.log{font-size:13px;border-left:3px solid var(--green);padding-left:9px;margin:9px 0}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal .card{max-width:480px;width:100%;margin:0}.choice small{display:block;color:var(--muted);margin-top:3px}.pill{float:right;color:var(--green);font-size:12px} </style></head><body><main class="app"><div class="top"><div><div class="logo">MINHA VIDA <span class="v">V3</span></div><div class="muted">Simulação de vida • carreira e legado</div></div><div class="money" id="money">R$ 0</div></div><section id="screen"></section><div class="tabs"><button class="tab" onclick="show('home')">🏠 Vida</button><button class="tab" onclick="show('career')">⚽ Carreira</button><button class="tab" onclick="show('life')">❤️ Vida pessoal</button><button class="tab" onclick="show('news')">📰 Notícias</button></div></main><div id="modal"></div><script>
const S={age:14,money:0,club:'Santos FC',level:'Sub-15',position:'Ponta',ovr:61,potential:84,followers:0,fame:4,reputation:45,titles:0,goals:0,assists:0,season:1,contract:0,partner:'Solteiro',children:0,house:'Casa da família',car:'Nenhum',career:'football',logs:[],events:0};
const events=[
{title:'Convite para o Sub-17',text:'Seu treinador está impressionado com seu desempenho. Ele quer que você treine com uma categoria acima.',opts:[['Aceitar','Você encara o desafio e ganha experiência.','ovr',3],['Ficar no Sub-15','Você prefere jogar mais minutos e evoluir com calma.','reputation',3],['Conversar com o empresário','Você começa a pensar na carreira profissional.','fame',2]]},
{title:'Vídeo viral',text:'Um vídeo seu treinando viralizou nas redes sociais.',opts:[['Aproveitar a fama','Você começa a criar conteúdo sem abandonar o futebol.','followers',12000],['Ignorar e focar no futebol','Seu desempenho continua sendo prioridade.','ovr',2],['Fechar publicidade','Você consegue sua primeira renda com imagem.','money',800]]},
{title:'Olheiro europeu',text:'Um olheiro estrangeiro assistiu a uma partida e pediu informações sobre você.',opts:[['Aceitar contato','Seu nome começa a circular fora do Brasil.','fame',7],['Recusar por enquanto','Você quer se firmar primeiro no Santos.','reputation',4],['Pedir para falar com o clube','Você age com profissionalismo.','reputation',7]]},
{title:'Problema fora de campo',text:'Uma postagem sua gerou comentários negativos e pode afetar sua imagem.',opts:[['Pedir desculpas','Você assume a responsabilidade e recupera parte da reputação.','reputation',8],['Responder aos críticos','A discussão aumenta sua fama, mas prejudica sua reputação.','fame',8],['Não responder','O assunto perde força com o tempo.','reputation',2]]},
{title:'Convocação',text:'A comissão técnica da Seleção Brasileira quer acompanhar você de perto.',opts:[['Aceitar a oportunidade','Você entra no radar das categorias de base da Seleção.','fame',12],['Continuar focado no clube','Você prefere evitar distrações.','ovr',4],['Comemorar com a família','A notícia fortalece seu vínculo familiar.','reputation',5]]}
];
function money(){document.getElementById('money').textContent='R$ '+S.money.toLocaleString('pt-BR')}function save(){localStorage.setItem('v3',JSON.stringify(S))}function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('v3')||'{}'))}catch(e){}}function log(x){S.logs.unshift('• '+x);S.logs=S.logs.slice(0,7);save()}
function show(x){let h='';if(x==='home')h=home();if(x==='career')h=career();if(x==='life')h=life();if(x==='news')h=news();document.getElementById('screen').innerHTML=h;money()}
function home(){return `<section class="card hero"><span class="tag">${S.age} anos</span><span class="tag">${S.club}</span><h1>${S.level} • ${S.position}</h1><p class="muted">Sua profissão não muda ao tocar em outros menus. Você constrói sua vida aos poucos.</p></section><section class="grid"><div class="stat"><span class="muted">OVR</span><b>${S.ovr}</b><div class="bar"><i style="width:${S.ovr}%"></i></div></div><div class="stat"><span class="muted">Potencial</span><b>${S.potential}</b><div class="bar"><i style="width:${S.potential}%"></i></div></div><div class="stat"><span class="muted">Fama</span><b>${S.fame}</b></div><div class="stat"><span class="muted">Seguidores</span><b>${S.followers.toLocaleString('pt-BR')}</b></div></section>${eventCard()}<section class="card"><h3>Próximo passo</h3><div class="actions"><button class="btn primary" onclick="advance()">⏩ Avançar 1 ano</button><button class="btn blue" onclick="randomEvent()">🎲 Acontecimento</button></div></section>`}
function career(){return `<section class="card"><h2>⚽ Minha carreira</h2><p><b>${S.club}</b> • ${S.level} • ${S.position}</p><p class="muted">Temporada ${S.season} • Contrato ${S.contract?'profissional':'base'}</p></section><section class="grid"><div class="stat">🏆 Títulos <b>${S.titles}</b></div><div class="stat">⚽ Gols <b>${S.goals}</b></div><div class="stat">🎯 Assistências <b>${S.assists}</b></div><div class="stat">⭐ Reputação <b>${S.reputation}</b></div></section><section class="card"><h3>Ferramentas da carreira</h3><div class="actions"><button class="btn" onclick="train()">🏋️ Treinar</button><button class="btn" onclick="match()">🏟️ Jogar partida</button><button class="btn" onclick="transfer()">🔄 Mercado</button><button class="btn" onclick="contract()">💰 Contrato</button><button class="btn" onclick="selection()">🇧🇷 Seleção</button><button class="btn" onclick="idol()">👑 Legado</button></div></section>`}
function life(){return `<section class="card"><h2>❤️ Vida pessoal</h2><p>Relacionamento: <b>${S.partner}</b></p><p>Filhos: <b>${S.children}</b></p><p>Casa: <b>${S.house}</b></p><p>Carro: <b>${S.car}</b></p></section><section class="card"><h3>📱 Influenciador</h3><p class="muted">Sua carreira de influenciador é paralela ao futebol. Ela pode crescer sem substituir sua profissão.</p><button class="btn primary" onclick="content()">Criar conteúdo</button></section><section class="card"><h3>👨‍👩‍👧 Família e legado</h3><button class="btn" onclick="family()">Tomar decisão familiar</button></section>`}
function news(){return `<section class="card"><h2>📰 Notícias</h2>${S.logs.length?S.logs.map(x=>`<div class="log">${x}</div>`).join(''):'<p class="muted">Nenhuma notícia ainda. Os acontecimentos surgem conforme sua vida avança.</p>'}</section>`}
function eventCard(){if(!S.pending)return '';return `<section class="card event"><span class="tag">ACONTECIMENTO</span><h2>${S.pending.title}</h2><p>${S.pending.text}</p>${S.pending.opts.map((o,i)=>`<button class="btn choice" onclick="choose(${i})">${o[0]}<small>${o[2]==='ovr'?'+ evolução':o[2]==='money'?'+ dinheiro':o[2]==='followers'?'+ seguidores':o[2]==='fame'?'+ fama':'+ reputação'}</small></button>`).join('')}</section>`}
function randomEvent(){S.pending=events[Math.floor(Math.random()*events.length)];S.events++;show('home')}
function choose(i){let o=S.pending.opts[i],k=o[2],v=o[3];S[k]+=v;log(o[1]);if(k==='money')S.money=Math.max(0,S.money);S.pending=null;show('home')}
function advance(){S.age++;S.season++;S.ovr=Math.min(99,S.ovr+(Math.random()<.7?1:0));if(S.age%2===0)S.money+=S.contract?50000:0;if(Math.random()<.75)randomEvent();else{log(`Você completou mais um ano de vida aos ${S.age} anos.`);show('home')}}
function train(){S.ovr=Math.min(99,S.ovr+1);log('Treino intenso: sua evolução aumentou.');show('career')}function match(){let win=Math.random()<S.ovr/100;S.goals+=Math.random()<.35?1:0;S.assists+=Math.random()<.25?1:0;if(win){S.reputation+=3;if(Math.random()<.18)S.titles++;log('Grande atuação: você ganhou destaque na partida.')}else log('Partida difícil: você aprende com os erros.');show('career')}
function transfer(){let clubs=['Flamengo','Palmeiras','Corinthians','Real Madrid','Barcelona','Manchester City'];let c=clubs[Math.floor(Math.random()*clubs.length)];if(S.ovr>=70||S.age>=18){S.club=c;S.money+=S.ovr*1200;S.contract=1;log(`Transferência confirmada: ${c}. Sua carreira deu um novo passo.`)}else log('Ainda é cedo para uma grande transferência. Continue evoluindo.');show('career')}
function contract(){if(S.age<17){log('Você ainda está na base e não pode assinar um grande contrato profissional.')}else{S.contract=1;S.money+=Math.max(10000,S.ovr*1500);log('Você assinou um novo contrato profissional.') }show('career')}
function selection(){if(S.ovr>=75){S.fame+=15;log('🇧🇷 Você foi convocado para uma categoria da Seleção Brasileira!')}else log('A Seleção ainda não chamou. Seu desempenho precisa crescer.');show('career')}
function idol(){if(S.titles>=3&&S.fame>=50){S.reputation+=20;log('👑 Você começou a ser tratado como ídolo do clube.')}else log('Seu legado ainda está sendo construído.');show('career')}
function content(){S.followers+=Math.floor(Math.random()*5000)+1000;S.fame+=2;S.money+=Math.floor(S.followers/1000)*10;log('📱 Um conteúdo seu ganhou novos seguidores.');show('life')}function family(){if(S.age>=18){S.children++;S.partner='Em relacionamento';log('Sua família cresceu e uma nova responsabilidade entrou na sua vida.')}else log('Você ainda é jovem para esse tipo de decisão.');show('life')}
load();show('home');
</script></body></html>
